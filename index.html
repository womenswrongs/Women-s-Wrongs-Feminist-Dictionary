<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WOMEN'S WRONGS — Feminist English Dictionary</title>
<style>
  :root{--bg:#1a1025;--card-bg:#2d1b3d;--accent:#c77dff;--accent2:#ff6b9d;
    --accent3:#ffd166;--text:#f0e6ff;--text-dim:#b8a9c9;--brE:#7fb3ff;--amE:#ff9d7f;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Georgia','Times New Roman',serif;background:var(--bg);color:var(--text);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem 80px;
    background-image:radial-gradient(circle at 20% 20%,rgba(199,125,255,.08) 0,transparent 50%),
    radial-gradient(circle at 80% 80%,rgba(255,107,157,.08) 0,transparent 50%)}
  header{text-align:center;margin-bottom:1.2rem;width:100%;max-width:720px}
  .site-logo {
  max-width: 100%;
  height: auto;
  max-height: 130px;
  margin-bottom: 0.8rem;
  display: block;
  margin-left: auto;
  margin-right: auto;
  filter: drop-shadow(0 4px 10px rgba(255,107,157,.3));
}
  .subtitle{color:var(--text-dim);font-size:.9rem;font-style:italic}

  .controls{max-width:1200px;margin:14px auto 18px;display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap}
  .btn-player{padding:10px 22px;border:none;background:linear-gradient(135deg,var(--accent2),var(--accent));
    color:#fff;font-size:.88rem;font-weight:700;border-radius:30px;cursor:pointer;transition:transform .15s,box-shadow .2s;
    font-family:inherit;box-shadow:0 4px 15px rgba(255,107,157,.35)}
  .btn-player:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(255,107,157,.5)}
  .btn-trainer{background:linear-gradient(135deg,var(--accent3),var(--accent2));box-shadow:0 4px 15px rgba(255,209,102,.35)}
  .btn-trainer:hover{box-shadow:0 6px 22px rgba(255,209,102,.5)}

  .legend{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-bottom:18px;font-size:.85rem;color:var(--text-dim)}
  .legend span{padding:5px 14px;background:rgba(255,255,255,.06);border-radius:20px;display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.06)}
  .legend .dot{width:10px;height:10px;border-radius:50%;display:inline-block}

  .theme-filter{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-bottom:26px;max-width:1200px;margin-left:auto;margin-right:auto}
  .theme-btn{padding:8px 18px;border-radius:100px;border:1px solid rgba(199,125,255,.3);
    background:rgba(199,125,255,.08);color:var(--accent);font-size:.82rem;font-weight:600;cursor:pointer;
    transition:all .2s;font-family:inherit;white-space:nowrap}
  .theme-btn:hover{background:rgba(199,125,255,.2);transform:translateY(-1px)}
  .theme-btn.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
    border-color:transparent;box-shadow:0 4px 15px rgba(199,125,255,.4)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;max-width:1200px;margin:0 auto}

  .card{perspective:1200px;height:430px;cursor:pointer}
  .card-inner{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.4,.0,.2,1);transform-style:preserve-3d}
  .card.flipped .card-inner{transform:rotateY(180deg)}
  .card-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:18px;padding:20px;
    display:flex;flex-direction:column;box-shadow:0 8px 28px rgba(0,0,0,.4);overflow-y:auto}
  .front{background:var(--card-bg);border-top:5px solid var(--accent)}
  .front .word{font-size:1.35rem;font-weight:700;color:#fff;text-align:center;margin-bottom:6px;line-height:1.3}
  .front .ipa-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
  .front .ipa-grid.single{grid-template-columns:1fr}
  .front .ipa-col{padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);text-align:center}
  .front .ipa-col.british{border-left:3px solid var(--brE)}
  .front .ipa-col.american{border-left:3px solid var(--amE)}
  .front .ipa-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);
    font-family:'Courier New',monospace;font-weight:600;margin-bottom:3px}
  .front .ipa-col.british .ipa-label{color:var(--brE)}
  .front .ipa-col.american .ipa-label{color:var(--amE)}
  .front .phonetic{font-family:'Courier New',monospace;font-size:.95rem;color:var(--accent3);word-break:break-word}
  .speak-row{display:flex;justify-content:center;gap:10px;margin:8px 0 10px;flex-wrap:wrap}
  .speak-btn{background:rgba(199,125,255,.15);border:1px solid rgba(199,125,255,.35);color:var(--accent);
    width:40px;height:40px;border-radius:50%;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:all .15s;flex-shrink:0}
  .speak-btn:hover{background:var(--accent);color:var(--bg);transform:scale(1.08)}
  .speak-btn:active{transform:scale(.95)}
  .speak-btn.speaking{background:var(--accent2);color:#fff;animation:pulse .9s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,107,157,.6)}50%{box-shadow:0 0 0 10px rgba(255,107,157,0)}}
  .front .hint{text-align:center;font-size:.75rem;color:#7d5ba6;margin-top:auto;padding-top:8px;border-top:1px dashed rgba(199,125,255,.2)}
  .back{background:linear-gradient(160deg,var(--card-bg),#1f1230);color:var(--text);transform:rotateY(180deg);
    border-top:5px solid var(--accent2);justify-content:flex-start}
  .back .translation{font-size:1.15rem;font-weight:700;text-align:center;margin-bottom:10px;color:var(--accent3);line-height:1.35}
  .back .label{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);margin-bottom:6px;
    font-family:'Courier New',monospace;border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:4px}
  .back .example{font-size:.85rem;line-height:1.5;margin-bottom:10px;display:flex;align-items:flex-start;gap:8px}
  .back .example .text{flex:1}
  .back .example .en{font-weight:600;color:#fff;display:block;margin-bottom:2px}
  .back .example .en em{color:var(--accent3);font-style:italic}
  .back .example .ru{color:var(--text-dim);font-size:.8rem;display:block;font-style:italic;line-height:1.4}
  .speak-mini{background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:50%;width:30px;height:30px;
    font-size:.8rem;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    transition:background .15s,transform .15s}
  .speak-mini:hover{background:rgba(255,255,255,.3);transform:scale(1.1)}
  .speak-mini.speaking{background:var(--accent2);animation:pulse .9s infinite}

  .player-overlay{display:none;position:fixed;inset:0;background:rgba(15,8,25,.94);z-index:1000;padding:30px 20px;
    overflow-y:auto;backdrop-filter:blur(6px)}
  .player-overlay.active{display:flex;align-items:center;justify-content:center}
  .player-box{background:linear-gradient(160deg,var(--card-bg),#1a1025);border-radius:24px;padding:35px 30px;
    max-width:500px;width:100%;text-align:center;color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.5);
    border:1px solid rgba(199,125,255,.15)}
  .player-box h2{font-size:1.4rem;margin-bottom:6px;color:var(--accent3)}
  .player-box .sub{color:var(--text-dim);font-size:.88rem;margin-bottom:20px}
  .player-word{font-size:1.8rem;font-weight:700;color:#fff;margin:18px 0 6px;min-height:55px;line-height:1.3}
  .player-ipa{font-size:.95rem;color:var(--accent3);font-family:'Courier New',monospace;margin-bottom:6px;min-height:22px}
  .player-trans{font-size:1.05rem;color:var(--text-dim);margin-bottom:20px;min-height:24px}
  .player-progress{font-size:.85rem;color:#7d5ba6;margin-bottom:10px}
  .player-bar{width:100%;height:5px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-bottom:20px}
  .player-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent3),var(--accent));width:0%;transition:width .4s}
  .player-buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .player-buttons button{padding:11px 20px;border:none;border-radius:12px;font-size:.9rem;font-weight:700;
    cursor:pointer;transition:transform .15s;font-family:inherit;min-width:85px}
  .p-play{background:#4caf50;color:#fff}
  .p-pause{background:#ff9800;color:#fff}
  .p-next{background:#2196f3;color:#fff}
  .p-close{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2)}

  /* ===================== ТРЕНАЖЁР ===================== */
  .trainer-overlay{display:none;position:fixed;inset:0;background:rgba(15,8,25,.96);z-index:1100;
    overflow-y:auto;backdrop-filter:blur(6px)}
  .trainer-overlay.active{display:block}
  .trainer-box{background:linear-gradient(160deg,var(--card-bg),#1a1025);border-radius:24px;padding:30px 26px;
    max-width:640px;width:calc(100% - 32px);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.5);
    border:1px solid rgba(199,125,255,.15);margin:40px auto 60px;position:relative}
  .trainer-box h2{font-size:1.35rem;margin-bottom:6px;color:var(--accent3);text-align:center}
  .trainer-box .sub{color:var(--text-dim);font-size:.85rem;margin-bottom:20px;text-align:center;font-style:italic}
  .trainer-section{margin-bottom:16px}
  .trainer-section-title{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);
    font-family:'Courier New',monospace;margin-bottom:8px}
  .trainer-chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{padding:7px 14px;border-radius:100px;border:1px solid rgba(199,125,255,.3);
    background:rgba(199,125,255,.08);color:var(--accent);font-size:.8rem;font-weight:600;cursor:pointer;
    transition:all .18s;font-family:inherit;white-space:nowrap}
  .chip:hover{background:rgba(199,125,255,.2)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;
    box-shadow:0 3px 12px rgba(199,125,255,.35)}
  .trainer-buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
  .trainer-buttons button{padding:11px 22px;border:none;border-radius:12px;font-size:.9rem;font-weight:700;
    cursor:pointer;transition:transform .15s;font-family:inherit}
  .trainer-buttons button:hover{transform:translateY(-1px)}
  .trainer-stats{display:flex;gap:10px;justify-content:center;margin-top:24px;padding-top:18px;
    border-top:1px solid rgba(255,255,255,.08);flex-wrap:wrap}
  .stat{display:flex;flex-direction:column;align-items:center;padding:8px 16px;background:rgba(255,255,255,.04);
    border-radius:12px;min-width:86px;border:1px solid rgba(255,255,255,.06)}
  .stat-num{font-size:1.3rem;font-weight:700;color:var(--accent3)}
  .stat-label{font-size:.66rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}

  .quiz-header{display:flex;justify-content:space-between;align-items:center;gap:10px;
    font-size:.82rem;color:var(--text-dim);font-family:'Courier New',monospace;margin-bottom:8px}
  .quiz-header #quizScore{color:#4caf50;font-weight:700}
  .quiz-close-btn{background:rgba(255,107,157,.15);border:1px solid rgba(255,107,157,.4);color:#ffb3cd;
    width:32px;height:32px;border-radius:50%;font-size:.9rem;font-weight:700;cursor:pointer;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;transition:all .15s;font-family:inherit;line-height:1}
  .quiz-close-btn:hover{background:var(--accent2);color:#fff;border-color:transparent;transform:scale(1.08)}
  .quiz-close-btn:active{transform:scale(.95)}
  .quiz-bar{width:100%;height:5px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-bottom:22px}
  .quiz-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent3),var(--accent));width:0%;
    transition:width .4s}
  .quiz-type{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);text-align:center;
    font-family:'Courier New',monospace;margin-bottom:14px}
  .quiz-prompt{text-align:center;margin-bottom:22px;min-height:56px}
  .q-word{font-size:1.6rem;font-weight:700;color:#fff;line-height:1.3}
  .q-trans{font-size:1.1rem;color:var(--accent3);line-height:1.45}
  .q-sentence{font-size:1.05rem;color:#fff;line-height:1.55;font-style:italic}
  .q-sentence .gap{color:var(--accent3);font-weight:700;font-style:normal}
  .q-ipa{font-family:'Courier New',monospace;font-size:.8rem;color:var(--text-dim);margin-top:8px}
  .q-play-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;
    padding:16px 32px;border-radius:50px;font-size:1.05rem;font-weight:700;cursor:pointer;font-family:inherit;
    box-shadow:0 6px 20px rgba(199,125,255,.35);transition:transform .15s}
  .q-play-btn:hover{transform:scale(1.05)}
  .quiz-options{display:grid;gap:10px}
  .q-option{padding:14px 18px;border-radius:14px;border:1.5px solid rgba(199,125,255,.25);
    background:rgba(199,125,255,.06);color:var(--text);font-size:.95rem;font-weight:600;cursor:pointer;
    font-family:inherit;text-align:left;transition:all .18s;line-height:1.35}
  .q-option:hover:not(:disabled){background:rgba(199,125,255,.18);border-color:var(--accent);transform:translateX(3px)}
  .q-option:disabled{cursor:default;opacity:.9}
  .q-option.correct{background:rgba(76,175,80,.25);border-color:#4caf50;color:#fff;opacity:1}
  .q-option.wrong{background:rgba(244,67,54,.22);border-color:#f44336;color:#fff;opacity:1}
  .quiz-options.spell-mode{display:flex;flex-direction:column;gap:10px}
  #spellInput{padding:14px 18px;border-radius:14px;border:1.5px solid rgba(199,125,255,.3);
    background:rgba(255,255,255,.05);color:#fff;font-size:1rem;font-family:inherit;outline:none;transition:all .15s}
  #spellInput:focus{border-color:var(--accent);background:rgba(199,125,255,.1)}
  #spellInput.correct{border-color:#4caf50;background:rgba(76,175,80,.15)}
  #spellInput.wrong{border-color:#f44336;background:rgba(244,67,54,.15)}
  .spell-check{background:#2196f3;color:#fff;padding:13px;border:none;border-radius:12px;
    font-size:.9rem;font-weight:700;cursor:pointer;font-family:inherit;transition:transform .15s}
  .spell-check:hover{transform:translateY(-1px)}
  .quiz-feedback{margin-top:16px;min-height:46px;text-align:center}
  .fb{padding:12px 14px;border-radius:12px;font-size:.88rem;line-height:1.45}
  .fb.ok{background:rgba(76,175,80,.15);border:1px solid rgba(76,175,80,.4);color:#a5d6a7}
  .fb.no{background:rgba(244,67,54,.12);border:1px solid rgba(244,67,54,.35);color:#ffcdd2}
  .fb b{color:#fff}
  .quiz-next-wrap{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
  .quiz-next-wrap button{padding:12px 28px;border:none;border-radius:12px;font-size:.9rem;font-weight:700;
    cursor:pointer;font-family:inherit;transition:transform .15s}
  .quiz-next-wrap button:hover{transform:translateY(-1px)}
  .q-finish{background:rgba(255,107,157,.18);color:#ffb3cd;border:1px solid rgba(255,107,157,.4) !important}
  .q-finish:hover{background:var(--accent2);color:#fff;border-color:transparent !important}

  .result-score{font-size:2.1rem;font-weight:700;text-align:center;color:var(--accent3);margin:16px 0 6px}
  .result-msg{text-align:center;color:var(--text-dim);font-size:.95rem;margin-bottom:22px;font-style:italic}
  .result-list{max-height:300px;overflow-y:auto;background:rgba(0,0,0,.18);border-radius:14px;padding:14px 16px;
    border:1px solid rgba(255,255,255,.07)}
  .result-list-title{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);
    font-family:'Courier New',monospace;margin-bottom:10px}
  .result-item{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:.88rem;line-height:1.45}
  .result-item:last-child{border-bottom:none}
  .result-item b{color:#fff}
  .result-perfect{text-align:center;padding:24px 10px;color:#a5d6a7;font-size:.95rem}

  @media (max-width:600px){
    body{padding:1rem .6rem 60px}
    .grid{grid-template-columns:1fr}
    .card{height:450px}
    h1{font-size:1.2rem}
    .front .word{font-size:1.15rem}
    .front .ipa-grid{grid-template-columns:1fr}
    .player-word{font-size:1.4rem}
    .trainer-box{padding:22px 16px;margin:16px auto 40px}
    .q-word{font-size:1.3rem}
    .q-trans{font-size:.98rem}
    .q-option{padding:12px 14px;font-size:.88rem}
    .result-score{font-size:1.7rem}
  }
</style>
</head>
<body>

<header>
 <img src="logo.png" alt="WOMEN'S WRONGS" class="site-logo">
  <p class="subtitle">The (Forever Incomplete) Feminist English Dictionary</p>
</header>

<div class="controls">
  <button class="btn-player" onclick="openPlayer()">🎧 Режим звука</button>
  <button class="btn-player btn-trainer" onclick="openTrainer()">🎯 Тренажёр</button>
</div>

<div class="legend">
  <span><span class="dot" style="background:#7fb3ff;"></span> 🇬🇧 British (BrE)</span>
  <span><span class="dot" style="background:#ff9d7f;"></span> 🇺🇸 American (AmE)</span>
</div>

<div class="theme-filter" id="themeFilter"></div>
<div class="grid" id="cardGrid"></div>

<!-- ===================== PLAYER ===================== -->
<div class="player-overlay" id="playerOverlay">
  <div class="player-box">
    <h2>🎧 Режим звука</h2>
    <p class="sub">Слушай и повторяй</p>
    <div class="player-word" id="playerWord">—</div>
    <div class="player-ipa" id="playerIpa">—</div>
    <div class="player-trans" id="playerTrans">—</div>
    <div class="player-progress" id="playerProgress">0 / 0</div>
    <div class="player-bar"><div class="player-bar-fill" id="playerBarFill"></div></div>
    <div class="player-buttons">
      <button class="p-play" onclick="playerPlay()">▶ Играть</button>
      <button class="p-pause" onclick="playerPause()">⏸ Пауза</button>
      <button class="p-next" onclick="playerNext()">⏭ Далее</button>
      <button class="p-close" onclick="closePlayer()">✕ Закрыть</button>
    </div>
  </div>
</div>

<!-- ===================== TRAINER ===================== -->
<div class="trainer-overlay" id="trainerOverlay">
  <div class="trainer-box">

    <!-- START -->
    <div id="trainerStart">
      <h2>🎯 Тренажёр</h2>
      <p class="sub">Выбери тему, тип заданий и количество вопросов</p>

      <div class="trainer-section">
        <div class="trainer-section-title">Тема</div>
        <div class="trainer-chips" id="trainerThemes"></div>
      </div>

      <div class="trainer-section">
        <div class="trainer-section-title">Тип заданий</div>
        <div class="trainer-chips" id="trainerModes">
          <button class="chip active" data-mode="mixed">🎲 Смешанный</button>
          <button class="chip" data-mode="en-ru">🇬🇧 → 🇷🇺 Перевод</button>
          <button class="chip" data-mode="ru-en">🇷🇺 → 🇬🇧 Перевод</button>
          <button class="chip" data-mode="listen">🎧 Аудио</button>
          <button class="chip" data-mode="fill">✍️ Пропуск</button>
          <button class="chip" data-mode="spell">⌨️ Написание</button>
        </div>
      </div>

      <div class="trainer-section">
        <div class="trainer-section-title">Количество вопросов</div>
        <div class="trainer-chips" id="trainerCount">
          <button class="chip" data-count="5">5</button>
          <button class="chip active" data-count="10">10</button>
          <button class="chip" data-count="15">15</button>
          <button class="chip" data-count="20">20</button>
        </div>
      </div>

      <div class="trainer-buttons">
        <button class="p-play" onclick="startTrainer()">▶ Начать</button>
        <button class="p-close" onclick="closeTrainer()">✕ Закрыть</button>
      </div>

      <div class="trainer-stats" id="trainerStats"></div>
    </div>

    <!-- QUIZ -->
    <div id="trainerQuiz" style="display:none">
      <div class="quiz-header">
        <span id="quizProgress">1 / 10</span>
        <span id="quizScore">✓ 0</span>
        <button class="quiz-close-btn" onclick="closeTrainerEarly()" title="Закрыть тренажёр">✕</button>
      </div>
      <div class="quiz-bar"><div class="quiz-bar-fill" id="quizBarFill"></div></div>
      <div class="quiz-type" id="quizType"></div>
      <div class="quiz-prompt" id="quizPrompt"></div>
      <div class="quiz-options" id="quizOptions"></div>
      <div class="quiz-feedback" id="quizFeedback"></div>
      <div class="quiz-next-wrap" id="quizNextWrap" style="display:none">
        <button class="p-next" onclick="nextQuestion()">Далее →</button>
        <button class="q-finish" onclick="finishEarly()">🏁 Завершить</button>
      </div>

/* ============================================================
   SPEECH
   ============================================================ */
function speakCard(cardIndex, accent, btn) {
  const c = ALL_CARDS[cardIndex];
  if (!c) return;
  if (btn) btn.classList.add('speaking');

  const wantsBr = accent === 'BrE';
  const wantsAm = accent === 'AmE';
  const allowBr = !c.onlyAm && c.br;
  const allowAm = !c.onlyBr && c.am;

  let effectiveAccent = accent;
  if (wantsBr && !allowBr && allowAm) effectiveAccent = 'AmE';
  if (wantsAm && !allowAm && allowBr) effectiveAccent = 'BrE';

  if (c.camUk || c.camUs) {
    const url = effectiveAccent === 'BrE' ? (c.camUk || c.camUs) : c.camUs;
    if (url) {
      const audio = new Audio();
      audio.src = url;
      audio.onended = () => { if (btn) btn.classList.remove('speaking'); };
      audio.onerror = () => { if (btn) btn.classList.remove('speaking'); googleTTS(c, effectiveAccent, btn); };
      const p = audio.play();
      if (p && p.catch) p.catch(() => { if (btn) btn.classList.remove('speaking'); googleTTS(c, effectiveAccent, btn); });
      window._audio = audio;
      return;
    }
  }
  googleTTS(c, effectiveAccent, btn);
}

function speakText(text, accent, btn) {
  if (btn) btn.classList.add('speaking');
  const lang = accent === 'BrE' ? 'en-GB' : 'en-US';
  const url = 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob'
            + '&tl=' + encodeURIComponent(lang)
            + '&q=' + encodeURIComponent(text);
  const audio = new Audio();
  audio.src = url;
  if (btn) {
    audio.onended = () => btn.classList.remove('speaking');
    audio.onerror = () => { btn.classList.remove('speaking'); ttsFallbackText(text, accent, btn); };
  }
  const p = audio.play();
  if (p && p.catch) p.catch(() => { if (btn) btn.classList.remove('speaking'); ttsFallbackText(text, accent, btn); });
  window._audio = audio;
}

function googleTTS(c, accent, btn) {
  const lang = accent === 'BrE' ? 'en-GB' : 'en-US';
  const text = c.tts || c.w;
  const url = 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob'
            + '&tl=' + encodeURIComponent(lang)
            + '&q=' + encodeURIComponent(text);
  const audio = new Audio();
  audio.src = url;
  audio.onended = () => { if (btn) btn.classList.remove('speaking'); };
  audio.onerror = () => { if (btn) btn.classList.remove('speaking'); ttsFallback(c, accent, btn); };
  const p = audio.play();
  if (p && p.catch) p.catch(() => { if (btn) btn.classList.remove('speaking'); ttsFallback(c, accent, btn); });
  window._audio = audio;
}

/* ============================================================
   FALLBACK — Web Speech API (женский голос)
   ============================================================ */
const FEMALE_NAMES = [
  'samantha','karen','moira','tessa','victoria','fiona','serena','allison','ava','susan',
  'nicky','kate','zira','hazel','linda','heera','female','женский',
  'google uk english female','google us english',
  'joanna','salli','kimberly','ivy','kendra','aria','jenny','michelle','emma',
  'amy','olivia','sonia','catherine','clara','elizabeth','libby','maisie','natasha',
  'kathy','agnes','sara','milena','alice','amelie','audrey','chloe','nora','marlene','anna'
];
const MALE_NAMES = [
  'david','daniel','alex','fred','george','male','мужской',
  'mark','james','ryan','tom','guy','matthew','joey','justin','brian','eric',
  'christopher','steve','oliver','thomas','rishi','arthur','liam','aaron',
  'nathan','gordon','richard','diego','jorge','juan','carlos','felipe','luca',
  'paolo','hiroshi','kevin','roger','ralph','bruce','nigel','graham','simon',
  'peter','paul','michael','william','robert','john','yuri','dmitri'
];
function isMaleVoice(v){
  const n = v.name.toLowerCase().replace(/female/g,'');
  return MALE_NAMES.some(m => n.includes(m));
}
function isFemaleVoice(v){
  if (isMaleVoice(v)) return false;
  const n = v.name.toLowerCase();
  return FEMALE_NAMES.some(f => n.includes(f));
}

function ttsFallback(card, accent, btn){
  if (!('speechSynthesis' in window)) return;
  const text = (card.tts || card.w).replace(/\s*\(.*?\)\s*/g,' ').replace(/\s*\/\s*/g,' or ').replace(/^the\s+/i,'').trim();
  doSpeak(text, accent, btn);
}
function ttsFallbackText(text, accent, btn){
  if (!('speechSynthesis' in window)) return;
  doSpeak(text.replace(/<[^>]*>/g, '').trim(), accent, btn);
}
function doSpeak(text, accent, btn){
  const u = new SpeechSynthesisUtterance(text);
  const voices = speechSynthesis.getVoices();
  const target = accent === 'BrE' ? 'en-gb' : 'en-us';
  let voice = voices.find(v => v.lang.replace('_','-').toLowerCase() === target && isFemaleVoice(v));
  if (!voice) voice = voices.find(v => v.lang.replace('_','-').toLowerCase().startsWith(target) && isFemaleVoice(v));
  if (!voice) voice = voices.find(v => v.lang.toLowerCase().startsWith('en') && isFemaleVoice(v));
  if (!voice) voice = voices.find(v => isFemaleVoice(v));
  if (!voice) voice = voices.find(v => v.lang.toLowerCase().startsWith('en') && !isMaleVoice(v));
  let female = false;
  if (voice){ u.voice = voice; u.lang = voice.lang; female = isFemaleVoice(voice); }
  else u.lang = accent === 'BrE' ? 'en-GB' : 'en-US';
  u.rate = 0.95;
  u.pitch = female ? 1.15 : 1.5;
  u.volume = 1;
  if (btn) {
    u.onend = () => btn.classList.remove('speaking');
    u.onerror = () => btn.classList.remove('speaking');
  }
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

   ====================== ТРЕНАЖЁР ============================
   ============================================================ */
let trainerTheme = 'all';
let trainerMode = 'mixed';
let trainerCount = 10;
let quizQuestions = [];
let quizIndex = 0;
let quizScore = 0;
let quizAnswered = false;
let quizMistakes = [];
let currentQuestion = null;

/* ---------- SRS (localStorage) ---------- */
function getSRS(){
  try { return JSON.parse(localStorage.getItem('womens-wrongs-srs') || '{}'); }
  catch(e){ return {}; }
}
function saveSRS(s){
  try { localStorage.setItem('womens-wrongs-srs', JSON.stringify(s)); } catch(e){}
}
function recordAnswer(word, correct){
  const srs = getSRS();
  const rec = srs[word] || {right:0, wrong:0, level:0};
  if (correct){ rec.right++; rec.level = Math.min(5, rec.level + 1); }
  else { rec.wrong++; rec.level = Math.max(0, rec.level - 1); }
  rec.lastSeen = Date.now();
  srs[word] = rec;
  saveSRS(srs);
}

/* ---------- utils ---------- */
function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pickDistractors(card, key, n){
  n = n || 3;
  const sameTheme = ALL_CARDS.filter(x => x !== card && x.cat === card.cat);
  const rest = ALL_CARDS.filter(x => x !== card && x.cat !== card.cat);
  const ordered = shuffle(sameTheme).concat(shuffle(rest));
  const seen = new Set([card[key]]);
  const res = [];
  for (const o of ordered){
    if (res.length >= n) break;
    const v = o[key];
    if (!v || seen.has(v)) continue;
    seen.add(v);
    res.push(o);
  }
  return res;
}
function gapSentence(card){
  if (!card.ex || !card.ex.length) return null;
  const en = card.ex[0].en;
  if (!/<em>/.test(en)) return null;
  return en.replace(/<em>(.*?)<\/em>/g, '<span class="gap">______</span>');
}
function normalizeVariants(word){
  return word.toLowerCase()
    .replace(/\s*\(.*?\)\s*/g, '')
    .split('/')
    .map(s => s.replace(/[^a-z\s'\-]/g, '').replace(/\s+/g, ' ').trim())
    .filter(Boolean);
}
function checkSpellAnswer(input, card){
  const variants = new Set();
  normalizeVariants(card.w).forEach(v => variants.add(v));
  if (card.tts) normalizeVariants(card.tts).forEach(v => variants.add(v));
  const cleaned = input.toLowerCase()
    .replace(/[^a-z\s'\-]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
  if (!cleaned) return false;
  if (variants.has(cleaned)) return true;
  if (variants.has(cleaned.replace(/^to\s+/, ''))) return true;
  if (variants.has(cleaned.replace(/^the\s+/, ''))) return true;
  return false;
}

  document.getElementById('trainerStart').style.display = 'block';

}
function closeTrainerEarly(){

  if (started){
    if (!confirm('Прервать тренировку?\n\nРезультаты текущей сессии не будут показаны. (Прогресс слов сохранён.)')) return;
  }

function renderTrainerThemes(){
  const c = document.getElementById('trainerThemes');
  c.innerHTML = themes.map(t => {
    const label = t === 'all' ? '📚 Все' : t;
    const active = t === trainerTheme ? 'active' : '';
    return `<button class="chip ${active}" data-theme="${t}">${label}</button>`;
  }).join('');
}
function renderTrainerStats(){
  const srs = getSRS();
  let learned = 0, learning = 0, newW = 0;
  ALL_CARDS.forEach(c => {
    const lvl = srs[c.w] ? srs[c.w].level : 0;
    if (lvl >= 4) learned++;
    else if (lvl >= 1) learning++;
    else newW++;
  });
  document.getElementById('trainerStats').innerHTML = `
    <div class="stat"><span class="stat-num">${learned}</span><span class="stat-label">выучено</span></div>
    <div class="stat"><span class="stat-num">${learning}</span><span class="stat-label">в процессе</span></div>
    <div class="stat"><span class="stat-num">${newW}</span><span class="stat-label">новых</span></div>
  `;

function bindTrainerChips(){
  document.querySelectorAll('#trainerThemes .chip').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('#trainerThemes .chip').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      trainerTheme = b.dataset.theme;
    };
  });
  document.querySelectorAll('#trainerModes .chip').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('#trainerModes .chip').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      trainerMode = b.dataset.mode;
    };
  });
  document.querySelectorAll('#trainerCount .chip').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('#trainerCount .chip').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      trainerCount = parseInt(b.dataset.count, 10);
    };
  });
}

/* ---------- start / generation ---------- */
function startTrainer(){
  quizQuestions = generateQuestions();
  if (!quizQuestions.length){
    alert('Нет слов для тренировки в этой теме.');
    return;
  }
  quizIndex = 0;
  quizScore = 0;
  quizMistakes = [];
  document.getElementById('trainerStart').style.display = 'none';
  document.getElementById('trainerResult').style.display = 'none';
  document.getElementById('trainerQuiz').style.display = 'block';
  window.scrollTo(0, 0);
  renderQuestion();
}

function generateQuestions(){
  const pool = trainerTheme === 'all'
    ? [...ALL_CARDS]
    : ALL_CARDS.filter(c => c.cat === trainerTheme);
  if (!pool.length) return [];

  const srs = getSRS();
  const scored = pool.map(c => {
    const lvl = srs[c.w] ? srs[c.w].level : 0;
    const weight = Math.random() * 1.2 + (5 - lvl) * 0.45;
    return { c, weight };
  });
  scored.sort((a, b) => b.weight - a.weight);

  const n = Math.min(trainerCount, pool.length);
  let chosen = scored.slice(0, n).map(x => x.c);
  while (chosen.length < trainerCount){
    chosen.push(pool[Math.floor(Math.random() * pool.length)]);
  }
  return shuffle(chosen).map(makeQuestion);
}

function makeQuestion(card){
  let mode = trainerMode;
  if (mode === 'mixed'){
    const modes = ['en-ru', 'ru-en', 'listen', 'fill', 'spell'];
    mode = modes[Math.floor(Math.random() * modes.length)];
  }
  if (mode === 'fill' && !gapSentence(card)) mode = 'en-ru';
  if (mode === 'listen' && !(card.tts || card.w)) mode = 'en-ru';
  return { card: card, mode: mode };
}

/* ---------- rendering question ---------- */
function renderQuestion(){
  const q = quizQuestions[quizIndex];
  currentQuestion = q;
  quizAnswered = false;

  document.getElementById('quizProgress').textContent = (quizIndex + 1) + ' / ' + quizQuestions.length;
  document.getElementById('quizScore').textContent = '✓ ' + quizScore;
  document.getElementById('quizBarFill').style.width = (quizIndex / quizQuestions.length * 100) + '%';
  document.getElementById('quizFeedback').innerHTML = '';
  document.getElementById('quizNextWrap').style.display = 'none';

  const typeEl = document.getElementById('quizType');
  const promptEl = document.getElementById('quizPrompt');
  const optionsEl = document.getElementById('quizOptions');
  optionsEl.innerHTML = '';
  optionsEl.className = 'quiz-options';

  const c = q.card;

  if (q.mode === 'en-ru'){
    typeEl.textContent = '🇬🇧 → 🇷🇺 Как переводится?';
    let ipa = '';
    if (c.br && !c.onlyAm) ipa = 'BrE ' + c.br;
    if (c.am && !c.onlyBr) ipa += (ipa ? '  ·  ' : '') + 'AmE ' + c.am;
    promptEl.innerHTML = `<div class="q-word">${c.w}</div>` + (ipa ? `<div class="q-ipa">${ipa}</div>` : '');
    renderOptions(q, optionsEl, 'm');

  } else if (q.mode === 'ru-en'){
    typeEl.textContent = '🇷🇺 → 🇬🇧 Выбери слово';
    promptEl.innerHTML = `<div class="q-trans">${c.m}</div>`;
    renderOptions(q, optionsEl, 'w');

  } else if (q.mode === 'listen'){
    typeEl.textContent = '🎧 Послушай и выбери слово';
    promptEl.innerHTML = `<button class="q-play-btn" onclick="playQuestionAudio()">🔊 Play</button>`;
    renderOptions(q, optionsEl, 'w');
    setTimeout(playQuestionAudio, 400);

  } else if (q.mode === 'fill'){
    typeEl.textContent = '✍️ Заполни пропуск';
    const sent = gapSentence(c) || c.w;
    promptEl.innerHTML = `<div class="q-sentence">${sent}</div>`;
    renderOptions(q, optionsEl, 'w');

  } else if (q.mode === 'spell'){
    typeEl.textContent = '⌨️ Напиши слово по-английски';
    promptEl.innerHTML = `<div class="q-trans">${c.m}</div>`;
    optionsEl.className = 'quiz-options spell-mode';
    optionsEl.innerHTML = `
      <input type="text" id="spellInput" placeholder="Напиши по-английски..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button class="spell-check" onclick="checkSpell()">Проверить</button>`;
    const inp = document.getElementById('spellInput');
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') checkSpell(); });
    setTimeout(() => inp.focus(), 120);
  }
}

function renderOptions(q, container, key){
  const c = q.card;
  const correct = c[key];
  const wrongs = pickDistractors(c, key, 3);
  const opts = shuffle([
    { text: correct, correct: true },
    ...wrongs.map(w => ({ text: w[key], correct: false }))
  ]);
  container.innerHTML = '';
  opts.forEach(o => {
    const btn = document.createElement('button');
    btn.className = 'q-option';
    btn.textContent = o.text;
    btn.dataset.correct = o.correct ? '1' : '0';
    btn.addEventListener('click', () => answerOption(btn));
    container.appendChild(btn);
  });
}

function playQuestionAudio(){
  const c = currentQuestion && currentQuestion.card;
  if (!c) return;
  const gi = ALL_CARDS.indexOf(c);
  const accent = c.onlyAm ? 'AmE' : 'BrE';
  speakCard(gi, accent, null);
}

/* ---------- answering ---------- */
function answerOption(btn){
  if (quizAnswered) return;
  quizAnswered = true;
  const correct = btn.dataset.correct === '1';

  document.querySelectorAll('.q-option').forEach(b => {
    b.disabled = true;
    if (b.dataset.correct === '1') b.classList.add('correct');
  });
  if (!correct) btn.classList.add('wrong');

  finishAnswer(correct, currentQuestion.card);
}

function checkSpell(){
  if (quizAnswered) return;
  const input = document.getElementById('spellInput');
  if (!input) return;
  const val = input.value.trim();
  if (!val) {
    input.focus();
    return;
  }
  const c = currentQuestion.card;
  const correct = checkSpellAnswer(val, c);
  quizAnswered = true;
  input.disabled = true;
  if (correct) input.classList.add('correct');
  else input.classList.add('wrong');

  if (!correct) input.value = val + '  →  ' + c.w;

  finishAnswer(correct, c);
}

function finishAnswer(correct, card){
  if (correct) quizScore++;
  else quizMistakes.push(card);
  recordAnswer(card.w, correct);

  document.getElementById('quizScore').textContent = '✓ ' + quizScore;

  const fb = document.getElementById('quizFeedback');
  fb.innerHTML = correct
    ? `<div class="fb ok">✓ Верно! <b>${card.w}</b> — ${card.m}</div>`
    : `<div class="fb no">✗ Правильно: <b>${card.w}</b> — ${card.m}</div>`;

  document.getElementById('quizNextWrap').style.display = 'flex';

  const gi = ALL_CARDS.indexOf(card);
  const accent = card.onlyAm ? 'AmE' : 'BrE';
  setTimeout(() => {
    if (currentQuestion && currentQuestion.mode !== 'listen'){
      speakCard(gi, accent, null);
    }
  }, 350);
}

function nextQuestion(){
  quizIndex++;
  if (quizIndex >= quizQuestions.length){
    showResult();
  } else {
    renderQuestion();
    window.scrollTo(0, 0);
  }
}

/* ---------- early finish ---------- */
function finishEarly(){
  const answeredTotal = quizIndex + (quizAnswered ? 1 : 0);
  if (answeredTotal === 0){
    if (confirm('Ты ещё не ответил ни на один вопрос. Закрыть тренажёр?')) closeTrainer();
    return;
  }
  if (!confirm(`Завершить тренировку досрочно?\n\nПройдено: ${answeredTotal} из ${quizQuestions.length}.\nБудут показаны результаты по уже отвеченным вопросам.`)) return;
  // обрезаем список до отвеченных
  quizQuestions = quizQuestions.slice(0, answeredTotal);
  showResult();
}

/* ---------- result ---------- */
function showResult(){
  document.getElementById('trainerQuiz').style.display = 'none';
  document.getElementById('trainerResult').style.display = 'block';

  const total = quizQuestions.length;
  const pct = total ? Math.round(quizScore / total * 100) : 0;

  document.getElementById('resultScore').textContent = quizScore + ' / ' + total + '  (' + pct + '%)';

  let msg = '';
  if (pct >= 90) msg = '🏆 Отлично! Ты уверенно знаешь эти слова.';
  else if (pct >= 70) msg = '👍 Хорошо! Ещё немного практики — и будет идеально.';
  else if (pct >= 50) msg = '💪 Неплохо, но есть над чем поработать.';
  else msg = '📚 Стоит повторить материал и попробовать снова.';
  document.getElementById('resultMsg').textContent = msg;

  const list = document.getElementById('resultList');
  if (quizMistakes.length === 0){
    list.innerHTML = `<div class="result-perfect">Идеально — ни одной ошибки! ✨</div>`;
  } else {
    list.innerHTML = `<div class="result-list-title">Повтори эти слова:</div>` +
      quizMistakes.map(c => `<div class="result-item"><b>${c.w}</b> — ${c.m}</div>`).join('');
  }

  const repeatBtn = document.getElementById('repeatBtn');
  repeatBtn.style.display = quizMistakes.length ? 'inline-block' : 'none';

  renderTrainerStats();
  window.scrollTo(0, 0);
}

function restartTrainer(){
  startTrainer();
}

function repeatMistakes(){
  if (!quizMistakes.length) return;
  const unique = [];
  const seen = new Set();
  quizMistakes.forEach(c => {
    if (!seen.has(c.w)){ seen.add(c.w); unique.push(c); }
  });
  quizQuestions = shuffle(unique).map(makeQuestion);
  quizIndex = 0;
  quizScore = 0;
  quizMistakes = [];
  document.getElementById('trainerResult').style.display = 'none';
  document.getElementById('trainerQuiz').style.display = 'block';
  renderQuestion();
  window.scrollTo(0, 0);
}

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================================ */
renderThemeFilter();
renderCards();
if ('speechSynthesis' in window) {
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
}
</script>
